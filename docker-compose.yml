
# version: '3.8'
services:
  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongo-auth:27017/authdb
    depends_on:
      - mongo-auth

  product-service:
    build: ./product-service
    ports:
      - "3002:3002"
    environment:
      - MONGO_URI=mongodb://mongo-product:27017/productdb
    depends_on:
      - mongo-product

  order-service:
    build: ./order-service
    ports:
      - "3003:3003"
    environment:
      - MONGO_URI=mongodb://mongo-order:27017/orderdb
    depends_on:
      - mongo-order

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - product-service
      - order-service

  mongo-auth:
    image: mongo
    container_name: mongo-auth
    ports:
      - "27018:27017"

  mongo-product:
    image: mongo
    container_name: mongo-product
    ports:
      - "27019:27017"

  mongo-order:
    image: mongo
    container_name: mongo-order
    ports:
      - "27020:27017"
